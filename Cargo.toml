[package]
name = "aiclipper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully local, offline short-form video clipping pipeline"
license = "MIT"

[[bin]]
name = "aiclipper"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ffmpeg-sidecar = "1"
libloading = "0.8"

[build-dependencies]
anyhow = "1"

[profile.release]
lto = true